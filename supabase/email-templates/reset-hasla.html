<!-- Supabase -> Authentication -> Email Templates -> "Reset Password"
     Temat: Ustaw nowe hasło w Skrojo -->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:520px;margin:0 auto;color:#1c1c1c">
  <h2 style="margin:0 0 12px">Ustaw nowe hasło</h2>
  <p>Otrzymaliśmy prośbę o zmianę hasła do konta Skrojo.</p>
  <p style="margin:24px 0">
    <a href="{{ .SiteURL }}/auth/potwierdz?token_hash={{ .TokenHash }}&type=recovery"
       style="background:#0a6bdc;color:#fff;text-decoration:none;padding:12px 22px;border-radius:8px;font-weight:bold;display:inline-block">Ustaw hasło</a>
  </p>
  <p style="font-size:13px;color:#666">Jeśli to nie Ty, zignoruj wiadomość: hasło pozostanie bez zmian.</p>
</div>
